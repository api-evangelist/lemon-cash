apis:
- aid: lemon-cash-mini-app-sdk
  name: Lemon Cash Mini App SDK
  description: 'The Lemon Mini App SDK is the public developer contract for building
    a Mini App that runs inside the Lemon Cash mobile app. It is a TypeScript library,
    not an HTTP API: calls are passed to the native app over the React Native WebView
    postMessage bridge and every action is confirmed by the user in-app. The surface
    is six functions — authenticate (Sign-In with Ethereum, EIP-4361, with optional
    user claims), deposit and withdraw (move tokens between the Lemon wallet and the
    Mini App wallet), transferMoney (ARS and PEN payouts to whitelisted bank
    destinations), callSmartContract (single or batched contract calls with optional
    Permit2 approvals) and isLemonWebView (environment detection).'
  humanURL: https://lemoncash.mintlify.app/
  baseURL: https://www.lemon.me/app/mini-apps/
  x-baseURL-note: 'Not an HTTP API base. This is the documented universal-link base for
    the Mini App surface (detail/:mini-app-id and webview/:mini-app-id); the SDK itself
    is transported over the in-app WebView bridge, not over HTTP.'
