aid: lemon-cash
name: Lemon Cash
description: 'Lemon Cash is a Latin American digital-money app operated in Argentina
  by Bay Treasure Caramel S.A., registered as a virtual asset service provider (PSAV
  N° 162) with the Comisión Nacional de Valores. Founded in 2019 by Marcelo Cavazzoli
  and Borja Martel Seward, Lemon combines a fiat wallet in pesos and dollars, crypto
  trading and custody, a Visa debit card with crypto cashback, stock investing and
  bill payment across Argentina, Peru, Brazil, Colombia, Chile, El Salvador and the
  wider region. Its public developer surface is the Lemon Mini App SDK: a TypeScript
  library that lets third-party web apps run inside the Lemon Cash mobile app, sign
  users in with Sign-In with Ethereum, request user claims, move crypto between the
  Lemon wallet and a Mini App wallet, transfer fiat to bank accounts, and call smart
  contracts on eleven mainnet and eleven testnet chains.'
