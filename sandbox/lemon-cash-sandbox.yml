model: testnet-chains
model_note: >-
  Lemon Cash ships no test-mode API keys and no hosted mock API — there is no HTTP API.
  The sandbox is a chain-level separation: a Mini App in development mode points at a
  testnet chain id and is funded from public testnet faucets. No Lemon-issued test
  values, test cards or magic identifiers are published.
environment_switching:
  how: Set the URL your Mini App connects to from the Mini App details screen in the
    Lemon Cash app.
  availability: Only available for Mini Apps in development mode.
  x-evidence: https://lemoncash.mintlify.app/testing/changing-dev-environment
test_networks:
  selected_by: the `chainId` parameter on authenticate, deposit, withdraw and callSmartContract
  chains:
