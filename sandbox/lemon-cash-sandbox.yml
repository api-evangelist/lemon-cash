faucets:
- name: Circle USDC Faucet
  url: https://faucet.circle.com/
  provides: 10 testnet USDC per hour
  networks: [Ethereum Sepolia, Polygon Amoy, Arbitrum Sepolia, and other supported networks]
  first_party: false
- name: Alchemy Faucets
  url: https://www.alchemy.com/faucets
  provides: native testnet tokens (ETH, POL, etc.)
  first_party: false
guardrails:
- rule: Deposits are blocked when the Mini App is connected to a testnet.
  reason: >-
    Otherwise a deposit would debit real money from the Lemon app and credit test
    tokens in the Mini App wallet.
  workaround: Send testnet tokens from a faucet to the Mini App wallet address instead.
  x-evidence: https://lemoncash.mintlify.app/functions/deposit
- rule: >-
    transferMoney destinations (`paymentId` — CBU/CVU in Argentina, CCI in Peru) must
    be whitelisted by Lemon before use, in any environment.
  workaround: Contact the Lemon team before changing or adding a paymentId.
  x-evidence: https://lemoncash.mintlify.app/functions/transfer-money
not_published:
- test-mode vs live-mode API key prefixes (no API keys exist)
- Lemon-issued test wallets, magic addresses or simulator values
- test clocks / time simulation
- fixture or event-trigger tooling
- a self-serve developer dashboard (a Mini App ID must be requested from the Lemon team)
